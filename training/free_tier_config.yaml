# Optimized for T4 GPUs (16GB VRAM)
model:
  teacher_id: "meta-llama/Llama-32B-Pro"
  student_id: "meta-llama/Llama-7B"

quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  lora_alpha: 32
  target_modules: ["q_proj", "v_proj"]
  lora_dropout: 0.05
  bias: "none"

training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 2e-4
  weight_decay: 0.01
  num_train_epochs: 3
  max_steps: -1
  gradient_checkpointing: true
  optim: "paged_adamw_32bit"
  lr_scheduler_type: "cosine"
  warmup_steps: 100
  max_seq_length: 1024
  fp16: false
  bf16: true

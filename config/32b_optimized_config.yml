# =============================================================================
# Stack 3.0 GPU Deployment - Optimized for 7B/32B
# =============================================================================

services:
  stack-3.0:
    build:
      context: .
      dockerfile: Dockerfile.gpu
      target: runtime
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}

    image: stack-3.0-gpu:latest
    container_name: stack-3.0-api

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # count: all for 32B (Multi-GPU), "1" for 7B
              count: all 
              capabilities: [gpu]

    environment:
      - MODEL_PATH=/model
      - DEVICE=cuda
      - PORT=8000
      - HOST=0.0.0.0
      - CUDA_VISIBLE_DEVICES=0,1,2,3 # Expanded for multi-GPU 32B support
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512,garbage_collection_threshold:0.8
      - TRANSFORMERS_CACHE=/model/.cache
      - HF_HOME=/model/.cache
      - DEFAULT_MAX_TOKENS=1024
      - DEFAULT_TEMPERATURE=0.2
      - DEFAULT_TOP_P=0.95
      # Optimization for larger models
      - USE_FLASH_ATTENTION_2=true 

    ports:
      - "${STACK_PORT:-8000}:8000"

    volumes:
      - ${MODEL_PATH:-./base_model_qwen}:/model:ro

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s # Increased for 32B model loading

    shm_size: '16gb' # Increased for large model tensor movement

    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"

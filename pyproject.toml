[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stack-3.0"
version = "0.1.0"
description = "Sovereign cognitive agent framework with Hierarchical Tool Router and Graph-RAG"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["ai", "agent", "rag", "sovereign", "autonomous", "tool-routing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.8.0",
    "chromadb>=0.4.0",
    "networkx>=3.0",
    "pydantic>=2.0.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0", "mypy>=1.9.0"]

[project.urls]
Homepage = "https://github.com/my-ai-stack/Stack-3.0"
Repository = "https://github.com/my-ai-stack/Stack-3.0"
Documentation = "https://stack-ai.me/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/stack3"]  # Adjust based on actual source structure
